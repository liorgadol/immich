# Fail2ban filter for Immich authentication failures
# Matches failed login attempts and 401/403 responses on auth endpoints

[Definition]
failregex = ^<HOST> - .* "(POST|GET) /api/auth/.* HTTP/.*" (401|403) .*$
            ^<HOST> - .* "(POST|GET) /api/oauth/.* HTTP/.*" (401|403) .*$

ignoreregex =
