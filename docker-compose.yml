name: immich

services:
  nginx-proxy:
    container_name: immich_nginx_proxy
    image: nginx:alpine
    labels:
      - "wud.watch=false"
      - "kuma.immich-proxy.docker.name=Immich proxy"
      - "kuma.immich-proxy.docker.docker_container=immich_nginx_proxy"
      # The public URL, so DDNS, port forwarding, nginx, immich-server and the
      # certificate are all covered. expiry_notification warns on Telegram
      # before the certificate runs out.
      - "kuma.immich-web.http.name=Immich web"
      - "kuma.immich-web.http.url=https://liorgadol.ddnsfree.com:2284/"
      - "kuma.immich-web.http.expiry_notification=true"
    ports:
      - '2284:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - immich-server
    restart: always

  fail2ban:
    container_name: immich_fail2ban
    image: crazymax/fail2ban:latest
    labels:
      - "kuma.immich-fail2ban.docker.name=Immich fail2ban"
      - "kuma.immich-fail2ban.docker.docker_container=immich_fail2ban"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban:/data
      - ./nginx/logs:/var/log/nginx:ro
    environment:
      - TZ=Asia/Jerusalem
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d
    restart: always

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    labels:
      - "wud.trigger.exclude=docker.local"
      - 'wud.tag.transform=^v\d+()$$ => rolling$$1'
      - "kuma.immich-server.docker.name=Immich server"
      - "kuma.immich-server.docker.docker_container=immich_server"
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      - /mnt/photos:/external:ro
    env_file:
      - .env
    # Port removed - accessed through nginx-proxy only
    # ports:
    #   - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    labels:
      - "wud.trigger.exclude=docker.local"
      - 'wud.tag.transform=^v\d+()$$ => rolling$$1'
      - "kuma.immich-ml.docker.name=Immich machine learning"
      - "kuma.immich-ml.docker.docker_container=immich_machine_learning"
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    labels:
      - "wud.watch=false"
      - "kuma.immich-redis.docker.name=Immich redis"
      - "kuma.immich-redis.docker.docker_container=immich_redis"
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    labels:
      - "wud.watch=false"
      - "kuma.immich-postgres.docker.name=Immich postgres"
      - "kuma.immich-postgres.docker.docker_container=immich_postgres"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
