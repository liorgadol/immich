events {
    worker_connections 1024;
}

http {
    # Logging for fail2ban monitoring
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Map to identify internal IPs (no rate limiting for local network)
    geo $limit_key {
        default $binary_remote_addr;
        192.168.0.0/16 "";
        62.90.36.225 "";
    }
    
    # Rate limiting zones (internal IPs bypass general rate limit)
    # General rate limit: 25 requests per second per IP, with burst of 50
    limit_req_zone $limit_key zone=general_limit:10m rate=25r/s;
    
    # Strict rate limit for auth endpoints: 5 requests per second per IP (applies to all)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    
    # Rate limit status code
    limit_req_status 429;
    
    # Hide nginx version
    server_tokens off;

    # Hide upstream framework headers
    proxy_hide_header X-Powered-By;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Powered-By "" always;

    # Client body size limit (adjust based on your upload needs)
    client_max_body_size 10G;
    client_body_buffer_size 128k;
    
    # Timeouts
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # HTTP server (redirects to HTTPS)
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # SSL session optimization
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/fullchain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        location / {
            # Apply general rate limiting (25 req/s with burst of 50)
            limit_req zone=general_limit burst=50 nodelay;
            
            proxy_pass http://immich-server:2283;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Immich
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Disable buffering for uploads and video streaming
            proxy_request_buffering off;
            proxy_buffering off;
        }
        
        # Stricter rate limiting for authentication endpoints
        location /api/auth/ {
            # Apply strict rate limiting (5 req/s with burst of 10)
            limit_req zone=auth_limit burst=10 nodelay;
            
            proxy_pass http://immich-server:2283;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
